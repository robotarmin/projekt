# ptp4l: a teszt-ado mint PTP grandmaster, AES67 media profile (A melleklet).
#   sudo install -Dm644 kuldo/aes67-gm.cfg /etc/linuxptp/aes67-gm.cfg
#
# Hardveres idobelyegzeshez (ethtool -T: hardware-transmit/receive):
#   time_stamping hardware, tx_timestamp_timeout 10, es a PHC-t a rendszerorahoz
#   kell kotni: phc2sys -a -rr (kulon szolgaltataskent).

[global]
domainNumber            0
# priority1 < 128: ez a gep nyeri a BTCA-t
priority1               100
priority2               128
clockClass              248
# A.2.2 alapertekek
logAnnounceInterval     1
logSyncInterval         -3
logMinDelayReqInterval  0
announceReceiptTimeout  3
# A.1, A.2.3: UDP/IPv4, delay request-response
network_transport       UDPv4
delay_mechanism         E2E
# 6.2: DSCP EF
dscp_event              46
dscp_general            46
utc_offset              37
time_stamping           software
# USB-s halozati kartyanal lassan jon a TX idobelyeg
tx_timestamp_timeout    50
