# ptp4l konfiguracio: a laptop mint PTP grandmaster (AES67 media profile, A melleklet)
# Hasznalat:  sudo ptp4l -f aes67-gm.cfg -i <interfesz> -m
#
# Szoftveres idobelyegzes: a grandmaster a rendszerorat (CLOCK_REALTIME) hirdeti,
# a vevo ptp4l-je ehhez hangolja a sajat rendszerorajat.

[global]
domainNumber            0
# 100 < 128: biztosan ez a gep nyeri a BMCA-t (A.2.2: a priority1 konfiguralhato)
priority1               100
priority2               128
clockClass              248

# A.2.2 alapertekek
logAnnounceInterval     1
logSyncInterval         -3
logMinDelayReqInterval  0
announceReceiptTimeout  3

# A.1 / A.2.3: UDP/IPv4, delay request-response
network_transport       UDPv4
delay_mechanism         E2E

# nincs hardveres PTP-ora
time_stamping           software
# USB-s halozati kartyanal a TX idobelyeg lassan erkezhet
tx_timestamp_timeout    50

# 6.2, 1. tablazat: az ora-uzenetek DSCP EF (46)
dscp_event              46
dscp_general            46

# TAI - UTC
utc_offset              37
