# PipeWire AES67 kuldo (L24 / 48 kHz / 2 csatorna / 1 ms packet time, PTP-hez kotve)
#
# Helye:  ~/.config/pipewire/pipewire.conf.d/50-aes67.conf
# Utana:  systemctl --user restart pipewire pipewire-pulse wireplumber
#
# Atirando:
#   - "enp0s13f0u3u1" -> a sajat interfeszed (ip -br link)
#   - sess.ts-refclk GMID -> a laptop PTP clockIdentity-je (docs/TELEPITES.md, 3. fejezet)
#
# Fontos (PipeWire 1.6.x-en kiprobalva):
#   - A PTP0-Driver blokkba NE tegyel "object.export = true" sort: a fo demonban
#     ettol ket PTP0-Driver jon letre (pw-top-ban ket kulonbozo ID).
#   - A kuldo RTP-idobelyeg eltolasat a PipeWire a "rtp.sender-ts-offset" stream-
#     tulajdonsagbol olvassa; ha hianyzik, minden indulaskor VELETLEN eltolast
#     hasznal, mikozben az SDP-ben mediaclk:direct=0 all. Ezert a stream.props-ban
#     sess.ts-direct, sess.ts-offset es rtp.sender-ts-offset is kell (lent).
#   - Ha az interfesz IP-cime megvaltozik (USB-s csatolo ki/bedugasa, DHCP), a
#     PipeWire a regi forrascimmel kuld tovabb: inditsd ujra a PipeWire-t.

context.objects = [
    # Graf-meghajto, amely a TAI orat koveti. Szoftveres PTP-vel a ptp4l a
    # rendszerorat hangolja, a TAI = rendszerora + kernel TAI offset (37 s).
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = PTP0-Driver
            node.group      = pipewire.ptp0
            priority.driver = 100000
            clock.name      = "clock.system.ptp0"
            clock.id        = "tai"
            resync.ms       = 1.5
        }
    }
]

context.modules = [
    # SAP bejelentes (AES67 E.2): a vevo "sap:" modban innen kapja az SDP-t
    { name = libpipewire-module-rtp-sap
        args = {
            local.ifname = "enp0s13f0u3u1"
            sap.ip       = "239.255.255.255"
            sap.port     = 9875
            net.ttl      = 32
            net.loop     = false
            stream.rules = [
                { matches = [ { sess.sap.announce = true } ]
                  actions = { announce-stream = { } }
                }
            ]
        }
    }

    # RTP kuldo
    { name = libpipewire-module-rtp-sink
        args = {
            local.ifname     = "enp0s13f0u3u1"
            destination.ip   = "239.69.0.1"
            destination.port = 5004
            net.mtu          = 1280
            net.ttl          = 32
            net.loop         = false

            # AES67 7.2.1: kotelezo 1 ms (48 minta 48 kHz-en)
            sess.min-ptime   = 1
            sess.max-ptime   = 1
            rtp.ptime        = 1

            sess.name        = "Laptop AES67"
            sess.media       = "audio"
            # 8.3: a=mediaclk:direct=0 (ST 2110-30 kompatibilis nulla offset)
            sess.ts-offset   = 0
            sess.latency.msec = 3
            # 8.2: a=ts-refclk; a GMID a laptop ptp4l clockIdentity-je
            sess.ts-refclk   = "ptp=IEEE1588-2008:00-E0-4C-FF-FE-68-0F-01:0"

            audio.format     = "S24BE"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]

            stream.props = {
                node.name           = "aes67-sink"
                node.description    = "AES67 (Laptop)"
                media.class         = "Audio/Sink"
                node.virtual        = false
                device.api          = "aes67"
                sess.sap.announce   = true
                node.always-process = true
                node.group          = "pipewire.ptp0"
                rtp.ntp             = 0
                # Az RTP-idobelyeg kozvetlenul a PTP0-Driver orajabol, eltolas nelkul:
                # igy egyezik az SDP mediaclk:direct=0 ertekevel (AES67 8.3)
                sess.ts-direct       = true
                sess.ts-offset       = 0
                rtp.sender-ts-offset = 0
            }
        }
    }
]
