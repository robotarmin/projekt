# A kód mesterséges intelligencia segítségével készült. Ezt az egyetemi szabályzatnak megfelelően itt jelölöm. [AI1]
# PipeWire AES67 teszt-ado: L24, 48 kHz, 2 csatorna, 1 ms packet time, PTP-hez kotve.
#
#   cp kuldo/50-aes67.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire pipewire-pulse wireplumber
#   pactl set-default-sink aes67-sink
#
# Atirando: local.ifname (2 helyen) es a sess.ts-refclk GMID-je
#   (sudo pmc -u -b 0 'GET DEFAULT_DATA_SET' | grep clockIdentity: aabbcc.fffe.ddeeff
#    -> AA-BB-CC-FF-FE-DD-EE-FF).
# Ha az interfesz IP-cime valtozik, a PipeWire-t ujra kell inditani.

context.objects = [
    # Graf-meghajto a TAI orarol (AES67 5.: a media ora TAI). NE legyen benne
    # "object.export = true": attol ket PTP0-Driver jon letre.
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = PTP0-Driver
            node.group      = pipewire.ptp0
            priority.driver = 100000
            clock.name      = "clock.system.ptp0"
            clock.id        = "tai"
            # hardveres PTP-nel a clock.id helyett: clock.interface = "<interfesz>"
            resync.ms       = 1.5
        }
    }
]

context.modules = [
    # SAP bejelentes (AES67 9., E.2)
    { name = libpipewire-module-rtp-sap
        args = {
            local.ifname = "enp0s13f0u1u1"
            sap.ip       = "239.255.255.255"
            sap.port     = 9875
            net.ttl      = 32
            net.loop     = false
            stream.rules = [
                { matches = [ { sess.sap.announce = true } ]
                  actions = { announce-stream = { } } }
            ]
        }
    }

    { name = libpipewire-module-rtp-sink
        args = {
            local.ifname      = "enp0s13f0u1u1"
            destination.ip    = "239.69.0.1"        # 6.1.3: 239.0.0.0/8
            destination.port  = 5004                # 6.3
            net.mtu           = 1280
            net.ttl           = 32
            net.loop          = false
            net.dscp          = 34                  # 6.2: AF41
            sess.min-ptime    = 1                   # 7.2.1: 1 ms (48 minta)
            sess.max-ptime    = 1
            rtp.ptime         = 1
            sess.name         = "Laptop AES67"
            sess.media        = "audio"
            sess.latency.msec = 3
            # 8.3: az RTP-idobelyeg = PTP0-Driver ora, eltolas nelkul. Itt ES a stream.props-ban
            # is kell, kulonben a PipeWire veletlen eltolassal kuld (mediaclk:direct=0 mellett).
            sess.ts-direct    = true
            sess.ts-offset    = 0
            sess.ts-refclk    = "ptp=IEEE1588-2008:00-E0-4C-FF-FE-68-0F-01:0"   # 8.2
            audio.format      = "S24BE"             # L24 (7.1)
            audio.rate        = 48000
            audio.channels    = 2
            audio.position    = [ FL FR ]
            stream.props = {
                node.name           = "aes67-sink"
                node.description    = "AES67 (Laptop)"
                media.class         = "Audio/Sink"
                device.api          = "aes67"
                node.virtual        = false
                node.always-process = true
                node.group          = "pipewire.ptp0"
                sess.sap.announce   = true
                rtp.ntp             = 0
                sess.ts-direct       = true
                sess.ts-offset       = 0
                rtp.sender-ts-offset = 0
            }
        }
    }
]
